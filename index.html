<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Manipulando o DOM</title>
  </head>
  <body>
    <main>
      <div class="palco">
        <div class="objeto" id="objeto"><p id="para"></p></div>
      </div>

      <section class="funcionalidades">
        <div class="cor">
          <label for="inputCor">MUDAR A COR DO OBJETO</label>
          <br />
          <input class="btnCor" id="inputCor" type="color" />
        </div>

        <div class="tamanho">
          <p>AJUSTAR O TAMANHO DO OBJETO</p>
          <br />

          <input
            type="range"
            id="altura"
            value="10"
            min="8"
            max="35"
            step="0.1"
            autocomplete="off"
            aria-label="Altura"
          />

          <br />
          <input
            type="range"
            id="largura"
            value="10"
            min="8"
            max="35"
            step="0.1"
            autocomplete="off"
            aria-label="Largura"
          />
        </div>
        <div class="texto">
          <label>
            ALTERAR O TEXTO DO OBJETO<br />
            <input
              type="text"
              placeholder="Escreva o que quiser"
              id="inputTexto"
            />
          </label>
        </div>

        <div class="campo-borda">
          <p>PERSONALIZAR BORDA</p>
          <div id="opcoes">
            <button id="btnBorda">ADICIONAR/REMOVER BORDA</button>
            <input
              class="btnCor"
              id="inputBorda"
              type="color"
              autocomplete="off"
            />
          </div>
        </div>
        <div>
          <p>ALTERAR O RAIO DA BORDA</p>
          <br />
          <input
            type="range"
            min="0"
            max="50"
            id="raio"
            value="0"
            step="0.1"
            autocomplete="off"
          />
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
